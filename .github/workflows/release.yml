name: Release FormulaSnap desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Test native shortcut handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Assign a version for this push
        run: node scripts/release-version.mjs
      - name: Build signed universal macOS release
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: FormulaSnap v__VERSION__
          releaseBody: Automatic build from ${{ github.sha }}. Download the DMG for the first installation; existing updater-enabled installations update automatically.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin -- --locked
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.build.outputs.releaseId }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_TAG" -F draft=false -f make_latest=true
